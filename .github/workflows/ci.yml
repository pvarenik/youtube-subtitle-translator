name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: |
          # Run lint and allow the known Firefox-incompatible service_worker error
          # (expected for cross-browser MV3: Chrome uses service_worker, Firefox uses scripts)
          # Write output to /tmp to avoid self-referential lint error
          npx web-ext lint --output=json > /tmp/lint-output.json 2>&1 || true
          echo "=== lint-output.json content ==="
          cat /tmp/lint-output.json
          echo "=== grep filtered ==="
          cat /tmp/lint-output.json | grep -E '^{' || echo "No lines starting with {"
          # Count errors that are NOT the expected service_worker error
          ERRORS=$(cat /tmp/lint-output.json | grep -E '^{' | jq '[.errors[] | select(.code != "MANIFEST_FIELD_UNSUPPORTED" or (.description | test("service_worker") | not))] | length' 2>/dev/null || echo "0")
          echo "ERRORS=$ERRORS"
          if [ "$ERRORS" -gt 0 ]; then
            echo "Unexpected errors found:"
            cat /tmp/lint-output.json | grep -E '^{' | jq '.errors[] | select(.code != "MANIFEST_FIELD_UNSUPPORTED" or (.description | test("service_worker") | not))'
            exit 1
          fi
          echo "Lint passed (only expected service_worker error present)"
